# SatsMeter — broker MQTT (Mosquitto 2.x)
# Demo/hackathon: sem TLS, acesso anônimo na rede local.
# Em produção: habilite autenticação por dispositivo (token/cert por ESP32).

listener 1883 0.0.0.0
allow_anonymous true

# Persistência das mensagens retidas / sessões
persistence true
persistence_location /mosquitto/data/

# Logs no stdout do container
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
