<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#ffffff;border:1px solid rgba(20,20,20,.08);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:11px;min-height:112px;box-shadow:0 1px 2px rgba(20,20,20,.03)">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="width:8px;height:8px;border-radius:50%;flex:none;background:{{ accent }}"></span>
    <span style="font:600 10.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8a857a">{{ label }}</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
    <span style="font:600 30px/1 'Space Grotesk',sans-serif;color:#17150f;font-variant-numeric:tabular-nums;letter-spacing:-.01em">{{ value }}</span>
    <span style="font:500 13px/1 'IBM Plex Sans',sans-serif;color:#8a857a">{{ unit }}</span>
  </div>
  <div style="font:400 12px/1.4 'IBM Plex Sans',sans-serif;color:#6b675e;margin-top:auto">{{ sub }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:268,&quot;height&quot;:124},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sats movimentados&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2,53 M&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sats&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;últimos 30 dias&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f7931a&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
