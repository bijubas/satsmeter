<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#ffffff;border:1px solid rgba(20,20,20,.08);border-radius:14px;padding:18px 20px 14px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(20,20,20,.03)">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div style="display:flex;flex-direction:column;gap:5px">
      <span style="font:600 10.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8a857a">{{ title }}</span>
      <div style="display:flex;align-items:baseline;gap:6px">
        <span style="font:600 24px/1 'Space Grotesk',sans-serif;color:#17150f;font-variant-numeric:tabular-nums;letter-spacing:-.01em">{{ valueLabel }}</span>
        <span style="font:500 12px/1 'IBM Plex Sans',sans-serif;color:#8a857a">{{ unit }}</span>
      </div>
    </div>
    <span style="font:500 11.5px/1.3 'IBM Plex Sans',sans-serif;color:#6b675e;text-align:right">{{ sub }}</span>
  </div>
  <svg viewBox="0 0 300 110" preserveAspectRatio="none" style="width:100%;height:118px;overflow:visible;display:block">
    <defs>
      <linearGradient id="{{ fillId }}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="{{ color }}" stop-opacity="0.20"></stop>
        <stop offset="1" stop-color="{{ color }}" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    <polygon points="{{ areaPoints }}" fill="url(#{{ fillId }})"></polygon>
    <polyline points="{{ linePoints }}" fill="none" stroke="{{ color }}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
    <circle cx="{{ dotX }}" cy="{{ dotY }}" r="3.5" fill="{{ color }}" stroke="#ffffff" stroke-width="2"></circle>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:210},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CONSUMO ACUMULADO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;valueLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12.000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;kWh&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f7931a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fillId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;g1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linePoints&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;areaPoints&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;dotX&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;dotY&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
