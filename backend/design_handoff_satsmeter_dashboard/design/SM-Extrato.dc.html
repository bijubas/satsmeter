<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#ffffff;border:1px solid rgba(20,20,20,.08);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,20,.03)">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px 14px">
    <span style="font:600 13px/1 'Space Grotesk',sans-serif;color:#17150f">Extrato · últimos eventos</span>
    <span style="display:flex;align-items:center;gap:6px;font:500 11px/1 'IBM Plex Sans',sans-serif;color:#6b675e">
      <span style="width:7px;height:7px;border-radius:50%;background:#1f9d57"></span>ao vivo
    </span>
  </div>
  <div style="display:grid;grid-template-columns:88px 1fr 96px 132px 120px;gap:8px;padding:9px 20px;background:#faf9f6;border-top:1px solid rgba(20,20,20,.06);border-bottom:1px solid rgba(20,20,20,.06)">
    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9a958a">Hora</span>
    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9a958a">Evento</span>
    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9a958a;text-align:right">Energia</span>
    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9a958a;text-align:right">Sats</span>
    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#9a958a;text-align:right">Status</span>
  </div>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
    <div style="display:grid;grid-template-columns:88px 1fr 96px 132px 120px;gap:8px;padding:12px 20px;border-bottom:1px solid rgba(20,20,20,.045);align-items:center">
      <span style="font:500 12px/1 'IBM Plex Mono',monospace;color:#6b675e">{{ r.time }}</span>
      <span style="display:flex;align-items:center;gap:9px;min-width:0">
        <span style="width:8px;height:8px;border-radius:50%;flex:none;background:{{ r.tipoColor }}"></span>
        <span style="font:500 13px/1.2 'IBM Plex Sans',sans-serif;color:#17150f">{{ r.tipo }}</span>
        <span style="font:500 12px/1 'IBM Plex Mono',monospace;color:#9a958a">{{ r.casa }}</span>
      </span>
      <span style="font:500 13px/1 'IBM Plex Mono',monospace;color:#6b675e;text-align:right">{{ r.kwh }}</span>
      <span style="font:600 13px/1 'IBM Plex Mono',monospace;color:#17150f;text-align:right;font-variant-numeric:tabular-nums">{{ r.sats }}</span>
      <span style="justify-self:end;font:600 11px/1 'IBM Plex Sans',sans-serif;padding:5px 10px;border-radius:20px;color:{{ r.statusColor }};background:{{ r.statusBg }}">{{ r.status }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:360},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{time:string;tipo:string;casa:string;tipoColor:string;kwh:string;sats:string;status:string;statusColor:string;statusBg:string}&gt;&quot;}}"></script>
</body>
</html>
